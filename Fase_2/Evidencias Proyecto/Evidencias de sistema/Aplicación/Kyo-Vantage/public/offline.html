<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6D28D9" />
    <title>Sin conexión | Kyo Vantage</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #fff;
        background: radial-gradient(circle at top right, #2d1760 0, #080711 48%, #050409 100%);
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        background: rgba(14, 13, 30, 0.92);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      }
      .mark {
        width: 72px;
        height: 72px;
        display: grid;
        place-items: center;
        margin: 0 auto 24px;
        border-radius: 20px;
        background: #6d28d9;
        font-size: 34px;
        font-weight: 800;
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 24px; color: #b8b5ca; line-height: 1.55; }
      button {
        width: 100%;
        padding: 14px 18px;
        border: 0;
        border-radius: 14px;
        color: #fff;
        background: #6d28d9;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #b99cff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">K</div>
      <h1>Sin conexión</h1>
      <p>Kyo Vantage necesita conexión para autenticarte y consultar tus datos financieros. Ninguna información privada se guarda en esta página.</p>
      <button type="button" onclick="window.location.reload()">Reintentar conexión</button>
    </main>
  </body>
</html>
